[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensehive-iot"
version = "1.8.2"
description = "Lightweight MQTT data logger and dashboard: Run -> Add Topic -> Publish -> See Data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Prince kumar" }]
keywords = ["mqtt", "iot", "dashboard", "logger", "sqlite", "home-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "Flask>=2.3,<4",
    "paho-mqtt>=1.6,<3",
    "pytz",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/855princekumar/sense-hive"
Issues = "https://github.com/855princekumar/sense-hive/issues"
"Docker Hub" = "https://hub.docker.com/r/devprincekumar/sense-hive"

[project.scripts]
sensehive = "sensehive.cli:main"
sensehive-demo = "sensehive.demo_fleet:main"

[tool.setuptools]
packages = ["sensehive"]
package-dir = { "sensehive" = "version-1.0" }
include-package-data = false

[tool.setuptools.package-data]
sensehive = ["templates/*.html", "static/*.js", "static/*.css", "static/SHA256SUMS", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real MQTT broker (set SENSEHIVE_TEST_BROKER=host:port)"]

[tool.ruff]
target-version = "py39"
line-length = 130
extend-exclude = ["node_modules"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, comprehensions, simplify and pylint errors/warnings;
# security rules run in Bandit (CI), so S is not repeated here.
select = ["E", "F", "W", "B", "C4", "PIE", "SIM", "PLE", "PLW"]
ignore = [
    "SIM105",   # try/except/pass reads plainer than contextlib.suppress here
    "PLW0603",  # module state (MQTT client, broker status) is global by design: one per process
]

[tool.ruff.lint.per-file-ignores]
"tools/ui_test.py" = ["E501"]   # browser-side JavaScript kept on one line per check
