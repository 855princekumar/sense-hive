name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}${{ matrix.paho && format(', paho-mqtt {0}', matrix.paho) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
        include:
          - python: "3.11"
            paho: "1.6.1"
    services:
      mosquitto:
        # 1.6 accepts anonymous clients on 1883 without a config file
        image: eclipse-mosquitto:1.6
        ports:
          - 1883:1883
    env:
      SENSEHIVE_TEST_BROKER: localhost:1883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r version-1.0/requirements.txt pytest
          if [ -n "${{ matrix.paho }}" ]; then pip install "paho-mqtt==${{ matrix.paho }}"; fi

      - name: Run regression tests (unit + integration)
        run: python -m pytest -v

  package:
    name: pip package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean venv and smoke test the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/sensehive --version
          cd /tmp
          /tmp/venv/bin/sensehive --port 5055 --data-dir /tmp/sensehive-data > /tmp/cli.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5055/api/health && break; sleep 1; done
          curl -sf http://localhost:5055/api/health | grep -q healthy
          curl -sf -o /dev/null http://localhost:5055/login
          test -f /tmp/sensehive-data/iot_dashboard.db
          cat /tmp/cli.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: version-1.0
          load: true
          tags: sensehive:ci

      - name: Container smoke test
        run: |
          test -z "$(docker run --rm --entrypoint ls sensehive:ci -A /app/data)" || { echo "image must not ship a database"; exit 1; }
          docker run -d --name sh -p 5000:5000 sensehive:ci
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
          curl -sf http://localhost:5000/api/health | grep -q healthy
          curl -sf -o /dev/null http://localhost:5000/login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/nodes)" = "401"
          curl -sI http://localhost:5000/login | grep -qi "content-security-policy: default-src 'self'; script-src 'self';"
          curl -sf -o /dev/null http://localhost:5000/static/login.js
          curl -sf -o /dev/null http://localhost:5000/static/vendor/react.production.min.js
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' sh)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' sh | grep -q healthy
          docker logs sh

  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: ruff (config in pyproject.toml)
        run: |
          pip install ruff==0.6.9
          ruff check --output-format=github .
      - name: No em dashes in code, docs or UI
        run: |
          em="$(printf '\342\200\224')"
          if git grep -nI -e "$em" -e '&mdash;' -e '&#8212;' -- . ':!package-lock.json' ':!version-1.0/static' ':!.github/workflows/ci.yml'; then
            echo "::error::Em dash found. Project style: use a colon, comma or parentheses instead."
            exit 1
          fi
      - name: No private product, device or customer names (terms kept in a secret)
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then echo "FORBIDDEN_TERMS not set (forks): skipped"; exit 0; fi
          found=0
          while IFS= read -r term; do
            term="$(printf '%s' "$term" | tr -d '\r')"
            [ -z "$term" ] && continue
            if git grep -qiIF -e "$term" -- . ':!package-lock.json' ':!version-1.0/static'; then
              echo "::error::A private term (secret line) appears in: $(git grep -liIF -e "$term" -- . ':!package-lock.json' ':!version-1.0/static' | tr '\n' ' ')"
              found=1
            fi
          done <<< "$FORBIDDEN_TERMS"
          exit $found

  security:
    name: Security scans (Bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.6 pip-audit==2.9.0
      - name: Bandit (no unreviewed medium or high finding)
        run: bandit -r version-1.0 tools Test-sensehive -ll -q
      - name: pip-audit (no dependency with a known vulnerability)
        run: pip-audit -r version-1.0/requirements.txt --progress-spinner off

  frontend:
    name: Front-end build matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Rebuild and compare with version-1.0/static
        run: npm run check
      - name: No page loads anything from another host
        run: |
          if grep -nE '(src|href)="(https?:)?//' version-1.0/templates/*.html; then
            echo "::error::Pages must load only SenseHive's own files (CSP script-src 'self')."; exit 1; fi

  ui:
    name: Browser UI (phone to desktop, zoom 67 to 200%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install -r version-1.0/requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Every page and dialog on every screen size and zoom, plus interactions
        run: python -W ignore tools/ui_test.py --out ui-report --min-checks 270
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ui-report
          path: ui-report/*.png
