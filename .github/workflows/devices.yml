name: Devices

# SenseHive against its device projects, without hardware:
#   PowerPulse (https://github.com/855princekumar/powerpulse), an ESP32 power beacon
#   in two builds: auto-discovery (secure topics) and manual (open topics);
#   the MQTT heartbeat agent (https://github.com/855princekumar/mqtt-heartbeat-service)
#   set up on a systemd node with a join token, beside a second SenseHive (isolation).
# docs/VALIDATE-WITHOUT-HARDWARE.md explains every step and how to run it yourself.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"          # weekly, also catches a change in PowerPulse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARDUINO_CLI_VERSION: "1.3.1"
  ARDUINO_CLI_SHA256: "376428d7d45be640c00812a71612e1742edc2f5f9ee3742a2d6da7870e079588"
  ESP32_CORE: "esp32:esp32@3.3.12"
  WOKWI_CLI_VERSION: "v0.27.1"
  WOKWI_CLI_SHA256: "c3faa32b752c63762a9e4852288f0ce26952475ade16c95ebb8f61a272425633"

jobs:
  powerpulse:
    name: PowerPulse end to end (simulated node, real broker)
    runs-on: ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:1.6           # accepts anonymous clients on 1883 without a config file
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: sense-hive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: 855princekumar/powerpulse
          ref: main
          path: powerpulse
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Build the firmware's encryption code for this machine
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y libmbedtls-dev
          cc -O2 -Wall -Wextra -Werror -o seal_cli powerpulse/test/host/seal_cli.c -lmbedcrypto
      - name: This SenseHive with the PowerPulse firmware's messages
        env:
          SENSEHIVE_DIR: ${{ github.workspace }}/sense-hive/version-1.0
          SEAL_CLI: ${{ github.workspace }}/seal_cli
          PP_TEST_BROKER: localhost:1883
        run: |
          pip install -r sense-hive/version-1.0/requirements.txt -r powerpulse/test/requirements.txt
          python -m pytest -v powerpulse/test/test_sensehive_e2e.py

  heartbeat-agent:
    name: Heartbeat agent, join token to a systemd node, two SenseHives on one broker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: sense-hive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: 855princekumar/mqtt-heartbeat-service
          ref: main
          path: agent
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Broker and a Debian 12 node with systemd
        run: |
          docker run -d --name mq -p 1883:1883 eclipse-mosquitto:2.0.20 mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name node --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw             --add-host host.docker.internal:host-gateway jrei/systemd-debian:12
          for i in $(seq 1 30); do docker exec node systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break; sleep 2; done
          docker exec node bash -c 'apt-get update -qq && apt-get install -y -qq python3 >/dev/null'
          pip install -r sense-hive/version-1.0/requirements.txt pytest pyyaml
      - name: Tokens read by the agent's own setup.py; fleets isolated
        run: cd sense-hive && AGENT_DIR=../agent python -m pytest -v tests/test_heartbeat_join.py
      - name: End to end, setup.py on the node, nothing added in SenseHive
        run: |
          if [ ! -f agent/tests/join_e2e.py ]; then echo "::notice::the agent has no join_e2e.py yet: skipped"; exit 0; fi
          python agent/tests/join_e2e.py --sensehive-dir sense-hive/version-1.0 --node node             --broker 127.0.0.1:1883 --node-broker host.docker.internal:1883

  wokwi:
    name: PowerPulse firmware on a simulated ESP32 (Wokwi)
    # Simulation minutes are limited: main, weekly and on demand, not every pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - name: Needs the WOKWI_CLI_TOKEN secret
        if: env.WOKWI_CLI_TOKEN == ''
        run: |
          echo "::notice::WOKWI_CLI_TOKEN not set (forks): the Wokwi test is skipped. See docs/VALIDATE-WITHOUT-HARDWARE.md"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: env.WOKWI_CLI_TOKEN != ''
        with:
          path: sense-hive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: env.WOKWI_CLI_TOKEN != ''
        with:
          repository: 855princekumar/powerpulse
          ref: main
          path: powerpulse
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        if: env.WOKWI_CLI_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Install arduino-cli, the ESP32 core, the libraries and wokwi-cli (pinned, checksummed)
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          curl -fsSL -o /tmp/acli.tgz "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          echo "${ARDUINO_CLI_SHA256}  /tmp/acli.tgz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf /tmp/acli.tgz -C "$HOME/bin" arduino-cli
          curl -fsSL -o "$HOME/bin/wokwi-cli" "https://github.com/wokwi/wokwi-cli/releases/download/${WOKWI_CLI_VERSION}/wokwi-cli-linuxstatic-x64"
          echo "${WOKWI_CLI_SHA256}  $HOME/bin/wokwi-cli" | sha256sum -c -
          chmod +x "$HOME/bin/wokwi-cli"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli lib install "WiFiManager@2.0.17" "PubSubClient@2.8" "ArduinoJson@7.4.2"
      - name: The real firmware, both builds, against this SenseHive over the public broker
        if: env.WOKWI_CLI_TOKEN != ''
        env:
          SENSEHIVE_DIR: ${{ github.workspace }}/sense-hive/version-1.0
          PP_TEST_BROKER: broker.hivemq.com:1883
        run: |
          pip install -r sense-hive/version-1.0/requirements.txt -r powerpulse/test/requirements.txt
          python -m pytest -v -s powerpulse/test/test_wokwi.py
