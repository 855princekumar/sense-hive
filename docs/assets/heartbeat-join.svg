<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Adding heartbeat nodes without EdgeShell</title>
  <desc id="desc">In SenseHive, Add node makes one join token per node, alone or many at once as a CSV. A token holds that node's name and keys and the broker, never the fleet master key. On one node: git clone the agent and run sudo python3 setup.py. For many nodes: tools/bulk_setup.py on your computer reads the tokens CSV, a nodes CSV and bulk.yaml with the broker login, and sets every node up over SSH. setup.py checks the token, logs in to the broker with TLS first and plain MQTT only if TLS cannot be reached, installs a hardened systemd service, and the node appears online by itself. Two SenseHives on the same broker each have their own fleet and never see each other's nodes.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .tt{font-size:18px;font-weight:700;fill:#0f172a}
      .t{font-size:12.5px;font-weight:700;fill:#0f172a}
      .lbl{font-size:11px;fill:#475569}
      .mut{font-size:11px;fill:#64748b}
      .hd{font-size:13px;font-weight:700;fill:#fff}
      .hs{font-size:10.5px;fill:#e2e8f0}
      .mono{font-size:10px;fill:#0f172a;font-family:Consolas,Menlo,monospace}
      .monow{font-size:10px;fill:#e2e8f0;font-family:Consolas,Menlo,monospace}
      .pill{font-size:10.5px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <text x="30" y="36" class="tt">Adding heartbeat nodes without EdgeShell</text>
  <text x="30" y="56" class="mut">One token per node. SenseHive never connects to the nodes; nothing without a token from this SenseHive can ever appear in it.</text>

  <!-- SenseHive -->
  <rect x="30" y="80" width="220" height="260" rx="12" fill="#fff" stroke="#1a56db" stroke-width="1.5"/>
  <path d="M42,80 H238 A12,12 0 0 1 250,92 V120 H30 V92 A12,12 0 0 1 42,80 Z" fill="#1a56db"/>
  <text x="44" y="99" class="hd">1  SenseHive: Add node</text>
  <text x="44" y="113" class="hs">Heartbeats page, signed in</text>
  <rect x="44" y="132" width="90" height="24" rx="12" fill="#1a56db"/><text x="89" y="148" class="pill" text-anchor="middle">One node</text>
  <rect x="140" y="132" width="96" height="24" rx="12" fill="#fff" stroke="#1a56db"/><text x="188" y="148" class="t" style="font-size:10.5px;fill:#1a56db" text-anchor="middle">Many (CSV)</text>
  <text x="44" y="178" class="t">a join token per node</text>
  <text x="44" y="196" class="lbl">its name, its own key, the</text>
  <text x="44" y="212" class="lbl">topic key, the broker</text>
  <text x="44" y="228" class="lbl" style="fill:#b91c1c">never the fleet master key</text>
  <text x="44" y="256" class="t">many: up to 500</text>
  <text x="44" y="274" class="mono">node,token</text>
  <text x="44" y="290" class="mono">pi-node-01,hbj1.eyJ2...</text>
  <text x="44" y="306" class="mono">pi-node-02,hbj1.eyJ2...</text>
  <text x="44" y="328" class="mut">shown once, keep it private</text>

  <line x1="250" y1="160" x2="286" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="250" y1="280" x2="286" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- one node -->
  <rect x="290" y="80" width="300" height="118" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <path d="M302,80 H578 A12,12 0 0 1 590,92 V114 H290 V92 A12,12 0 0 1 302,80 Z" fill="#d97706"/>
  <text x="304" y="102" class="hd">2a  One node: on the node itself</text>
  <rect x="304" y="122" width="272" height="64" rx="6" fill="#0f172a"/>
  <text x="314" y="140" class="monow">git clone .../mqtt-heartbeat-service</text>
  <text x="314" y="156" class="monow">cd mqtt-heartbeat-service</text>
  <text x="314" y="172" class="monow">sudo python3 setup.py   # token, login</text>

  <!-- many nodes -->
  <rect x="290" y="214" width="300" height="126" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <path d="M302,214 H578 A12,12 0 0 1 590,226 V248 H290 V226 A12,12 0 0 1 302,214 Z" fill="#d97706"/>
  <text x="304" y="236" class="hd">2b  Many nodes: from your computer, SSH</text>
  <rect x="304" y="256" width="272" height="22" rx="6" fill="#0f172a"/>
  <text x="314" y="271" class="monow">python tools/bulk_setup.py</text>
  <text x="304" y="296" class="lbl">picks the tokens CSV and a nodes CSV</text>
  <text x="304" y="312" class="lbl">(node, host, user, port); the broker login</text>
  <text x="304" y="328" class="lbl">from bulk.yaml; a results CSV per run</text>

  <line x1="590" y1="140" x2="626" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="280" x2="626" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- setup.py on node -->
  <rect x="630" y="80" width="340" height="260" rx="12" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <path d="M642,80 H958 A12,12 0 0 1 970,92 V120 H630 V92 A12,12 0 0 1 642,80 Z" fill="#059669"/>
  <text x="644" y="99" class="hd">3  setup.py on each node</text>
  <text x="644" y="113" class="hs">Raspberry Pi OS, Debian, Ubuntu; Python 3.7+</text>
  <g class="lbl">
    <circle cx="652" cy="140" r="9" fill="#059669"/><text x="652" y="144" class="pill" text-anchor="middle">1</text>
    <text x="670" y="144" class="t">checks the token</text><text x="790" y="144">a cut paste installs nothing</text>
    <circle cx="652" cy="172" r="9" fill="#059669"/><text x="652" y="176" class="pill" text-anchor="middle">2</text>
    <text x="670" y="176" class="t">logs in to the broker</text><text x="806" y="176">a real MQTT login</text>
    <rect x="670" y="186" width="286" height="36" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="680" y="201">TLS first; plain MQTT only if TLS cannot</text>
    <text x="680" y="215">be reached; a refused login never falls back</text>
    <circle cx="652" cy="242" r="9" fill="#059669"/><text x="652" y="246" class="pill" text-anchor="middle">3</text>
    <text x="670" y="246" class="t">installs the service</text><text x="806" y="246">systemd, own user</text>
    <text x="670" y="262">read-only system, 64 MB, 10 % CPU, at boot</text>
    <circle cx="652" cy="290" r="9" fill="#059669"/><text x="652" y="294" class="pill" text-anchor="middle">4</text>
    <text x="670" y="294" class="t">appears online by itself</text>
    <text x="670" y="310">nothing to add in SenseHive</text>
    <text x="670" y="328" class="mono">setup.py --test  --status  --set-credentials</text>
  </g>

  <!-- isolation -->
  <text x="30" y="378" class="t" font-size="14">Every SenseHive is its own fleet, even on the same public broker</text>
  <rect x="30" y="392" width="300" height="150" rx="12" fill="#fff" stroke="#1a56db" stroke-width="1.5"/>
  <text x="46" y="416" class="t">Company A: SenseHive</text>
  <text x="46" y="434" class="mono">fleet 3f9c2a71b0d4</text>
  <g><circle cx="58" cy="462" r="7" fill="#059669"/><text x="72" y="466" class="lbl">plant-a-pi  online</text>
  <circle cx="58" cy="486" r="7" fill="#059669"/><text x="72" y="490" class="lbl">gateway  online</text></g>
  <text x="46" y="524" class="mut">only nodes with A's tokens</text>

  <rect x="350" y="392" width="300" height="150" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="366" y="416" class="t">The same broker</text>
  <text x="366" y="436" class="lbl">A's topics and B's topics differ</text>
  <text x="366" y="452" class="lbl">and change every 10 minutes</text>
  <text x="366" y="476" class="lbl">a message delivered anyway does</text>
  <text x="366" y="492" class="lbl">not decrypt: dropped and counted</text>
  <text x="366" y="524" class="mut">same node names stay separate nodes</text>
  <line x1="330" y1="466" x2="348" y2="466" stroke="#dc2626" stroke-width="2"/>
  <line x1="652" y1="466" x2="670" y2="466" stroke="#dc2626" stroke-width="2"/>

  <rect x="670" y="392" width="300" height="150" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="686" y="416" class="t">Company B: another SenseHive</text>
  <text x="686" y="434" class="mono">fleet 8a01e5c96f27</text>
  <g><circle cx="698" cy="462" r="7" fill="#059669"/><text x="712" y="466" class="lbl">plant-b-pi  online</text>
  <circle cx="698" cy="486" r="7" fill="#059669"/><text x="712" y="490" class="lbl">gateway  online</text></g>
  <text x="686" y="524" class="mut">never sees A's nodes (tested in CI)</text>
</svg>
