<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How the MQTT heartbeat works</title>
  <desc id="desc">The heartbeat agent on each node holds only its own key and the topic key, and publishes encrypted birth, heartbeat and last-will messages to a public MQTT broker on topics that change every ten minutes. SenseHive computes those topics from the master key, subscribes, derives each sender's key from the key id in the message, verifies freshness and order, and records the node on its first heartbeat without any list of nodes. The state is shown on the heartbeats page and served by a read-only API to EdgeShell and other tools.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .tt{font-size:15px;font-weight:700;fill:#0f172a}
      .t{font-size:12.5px;font-weight:700;fill:#0f172a}
      .lbl{font-size:11px;fill:#475569}
      .mut{font-size:11px;fill:#64748b}
      .hd{font-size:13px;font-weight:700;fill:#fff}
      .hs{font-size:10.5px;fill:#e2e8f0}
      .mono{font-size:10px;fill:#0f172a;font-family:Consolas,Menlo,monospace}
      .num{font-size:11px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="610" fill="#f8fafc"/>
  <text x="30" y="34" class="tt" font-size="18">How the MQTT heartbeat works</text>
  <text x="30" y="54" class="mut">A second status path for every node, over a public broker, encrypted end to end. Nothing to configure per node in SenseHive.</text>

  <!-- A: agent -->
  <rect x="30" y="80" width="225" height="360" rx="12" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <path d="M42,80 H243 A12,12 0 0 1 255,92 V122 H30 V92 A12,12 0 0 1 42,80 Z" fill="#059669"/>
  <text x="44" y="100" class="hd">Heartbeat agent</text>
  <text x="44" y="115" class="hs">on every node, systemd, own user</text>
  <text x="44" y="144" class="t">Holds (agent.env, 0640)</text>
  <text x="44" y="162" class="lbl">its name and key id</text>
  <text x="44" y="178" class="lbl">its own node key</text>
  <text x="44" y="194" class="lbl">the topic key</text>
  <text x="44" y="210" class="lbl" style="fill:#b91c1c">never the master key</text>
  <text x="44" y="238" class="t">Does</text>
  <text x="44" y="256" class="lbl">connects over TLS with a signed</text>
  <text x="44" y="272" class="lbl">last will for this session</text>
  <text x="44" y="288" class="lbl">sends birth on connect</text>
  <text x="44" y="304" class="lbl">sends hb every 10 s (config.yaml)</text>
  <text x="44" y="320" class="lbl">moves to the new topic every 10 min</text>
  <text x="44" y="336" class="lbl">reloads config.yaml on the fly</text>
  <text x="44" y="364" class="t">Sends only</text>
  <text x="44" y="382" class="lbl">name, time, session, counter,</text>
  <text x="44" y="398" class="lbl">kind and agent version</text>
  <text x="44" y="414" class="lbl">no addresses, credentials or data</text>

  <line x1="257" y1="200" x2="281" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- B: broker -->
  <rect x="285" y="80" width="190" height="360" rx="12" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <path d="M297,80 H463 A12,12 0 0 1 475,92 V122 H285 V92 A12,12 0 0 1 297,80 Z" fill="#334155"/>
  <text x="299" y="100" class="hd">Public MQTT broker</text>
  <text x="299" y="115" class="hs">TLS 8883, anyone can read</text>
  <text x="299" y="144" class="t">Topic right now</text>
  <text x="299" y="162" class="mono">3abd08/4a0e86dbcd37...</text>
  <text x="299" y="180" class="lbl">changes every 10 minutes,</text>
  <text x="299" y="196" class="lbl">derived from the topic key</text>
  <text x="299" y="224" class="t">Each message</text>
  <rect x="299" y="234" width="16" height="22" rx="3" fill="#e2e8f0"/>
  <text x="307" y="249" font-size="9" text-anchor="middle" fill="#0f172a">v</text>
  <rect x="317" y="234" width="44" height="22" rx="3" fill="#d1fae5"/>
  <text x="339" y="249" font-size="9" text-anchor="middle" fill="#0f172a">key id</text>
  <rect x="363" y="234" width="36" height="22" rx="3" fill="#e0f2fe"/>
  <text x="381" y="249" font-size="9" text-anchor="middle" fill="#0f172a">nonce</text>
  <rect x="401" y="234" width="60" height="22" rx="3" fill="#fef3c7"/>
  <text x="431" y="249" font-size="9" text-anchor="middle" fill="#0f172a">AES-GCM</text>
  <text x="299" y="276" class="lbl">version, key id and topic are</text>
  <text x="299" y="292" class="lbl">authenticated: a message cannot</text>
  <text x="299" y="308" class="lbl">be altered or moved</text>
  <text x="299" y="336" class="t">A stranger sees</text>
  <text x="299" y="354" class="lbl">random topics and bytes:</text>
  <text x="299" y="370" class="lbl">no names, no fleet, no IPs</text>

  <line x1="477" y1="200" x2="501" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- C: SenseHive receiver -->
  <rect x="505" y="80" width="250" height="360" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <path d="M517,80 H743 A12,12 0 0 1 755,92 V122 H505 V92 A12,12 0 0 1 517,80 Z" fill="#d97706"/>
  <text x="519" y="100" class="hd">SenseHive heartbeat receiver</text>
  <text x="519" y="115" class="hs">needs only HEARTBEAT_MASTER_KEY</text>

  <circle cx="527" cy="140" r="9" fill="#d97706"/><text x="527" y="144" class="num" text-anchor="middle">1</text>
  <text x="543" y="144" class="t">Finds the topics itself</text>
  <text x="543" y="161" class="lbl">computes the previous, current and</text>
  <text x="543" y="176" class="lbl">next topic from the master key and</text>
  <text x="543" y="191" class="lbl">subscribes: no node list, no setup</text>

  <circle cx="527" cy="214" r="9" fill="#d97706"/><text x="527" y="218" class="num" text-anchor="middle">2</text>
  <text x="543" y="218" class="t">Opens each message</text>
  <text x="543" y="235" class="lbl">derives the sender's key from the</text>
  <text x="543" y="250" class="lbl">key id, then decrypts and verifies</text>

  <circle cx="527" cy="273" r="9" fill="#d97706"/><text x="527" y="277" class="num" text-anchor="middle">3</text>
  <text x="543" y="277" class="t">Checks it</text>
  <text x="543" y="294" class="lbl">name matches the key id, time within</text>
  <text x="543" y="309" class="lbl">2 min, newer than the last one,</text>
  <text x="543" y="324" class="lbl">and for the current session</text>

  <circle cx="527" cy="347" r="9" fill="#d97706"/><text x="527" y="351" class="num" text-anchor="middle">4</text>
  <text x="543" y="351" class="t">Records it</text>
  <text x="543" y="368" class="lbl">a node appears on its first heartbeat;</text>
  <text x="543" y="383" class="lbl">state, minutes online, status changes</text>
  <text x="519" y="420" class="lbl" style="fill:#b91c1c">anything else is dropped and counted</text>

  <line x1="757" y1="200" x2="781" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- D: readers -->
  <rect x="785" y="80" width="185" height="360" rx="12" fill="#fff" stroke="#1a56db" stroke-width="1.5"/>
  <path d="M797,80 H958 A12,12 0 0 1 970,92 V122 H785 V92 A12,12 0 0 1 797,80 Z" fill="#1a56db"/>
  <text x="799" y="100" class="hd">Read it anywhere</text>
  <text x="799" y="115" class="hs">a page and a read-only API</text>
  <text x="799" y="144" class="t">/heartbeats page</text>
  <text x="799" y="161" class="lbl">for signed-in users</text>
  <text x="799" y="189" class="t">API, bearer token</text>
  <text x="799" y="207" class="mono">/api/heartbeat/status</text>
  <text x="799" y="223" class="mono">/api/heartbeat/nodes</text>
  <text x="799" y="239" class="mono">/api/heartbeat/minutes</text>
  <text x="799" y="255" class="mono">/api/heartbeat/events</text>
  <text x="799" y="271" class="lbl">GET only, JSON</text>
  <text x="799" y="299" class="t">Used by</text>
  <text x="799" y="317" class="lbl">EdgeShell: badges, uptime, SLA</text>
  <text x="799" y="333" class="lbl">Grafana, Node-RED,</text>
  <text x="799" y="349" class="lbl">Home Assistant, scripts:</text>
  <text x="799" y="365" class="lbl">anything that reads JSON</text>

  <!-- States -->
  <text x="30" y="474" class="t">Node states</text>
  <rect x="30" y="486" width="300" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="46" y="506" class="t" style="fill:#047857">online</text>
  <text x="46" y="523" class="lbl">a verified heartbeat in the last 35 s</text>
  <rect x="350" y="486" width="300" height="48" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="366" y="506" class="t" style="fill:#b91c1c">offline</text>
  <text x="366" y="523" class="lbl">its last will arrived: the connection dropped</text>
  <rect x="670" y="486" width="300" height="48" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="686" y="506" class="t" style="fill:#b45309">silent</text>
  <text x="686" y="523" class="lbl">nothing heard: usually the broker or internet</text>

  <rect x="30" y="550" width="940" height="40" rx="10" fill="#0f172a"/>
  <text x="46" y="575" font-size="12" fill="#e2e8f0"><tspan font-weight="700" fill="#fff">Adding a node:</tspan> install the agent from EdgeShell's Fleet Setup (or with its agent.env). It shows up in SenseHive on its first heartbeat; nothing to add in SenseHive.</text>
</svg>
